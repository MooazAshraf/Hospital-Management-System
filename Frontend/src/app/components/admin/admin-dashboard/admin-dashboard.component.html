<app-navbar></app-navbar>

<main class="min-h-screen bg-gray-50/50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto space-y-10">
    <!-- Header Section -->
    <div
      class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-gray-200/80 pb-6"
    >
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-[#1B3B2B]">Admin Dashboard</h1>

        <p class="text-sm text-gray-500 mt-1">
          Manage system operations, users, departments, and medical records.
        </p>
      </div>

      <div>
        <a
          routerLink="/admin/patients"
          class="inline-flex items-center gap-2 px-5 py-2.5 bg-[#1B3B2B] text-white font-semibold text-sm rounded-xl hover:bg-emerald-900 shadow-sm transition-all"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>

          View Patient List
        </a>
      </div>
    </div>

    <!-- Overview Stats -->
    <div>
      <h2 class="text-lg font-bold text-gray-800 mb-4">Overview</h2>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
        <div
          *ngFor="let c of overview"
          class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm"
        >
          <div class="text-4xl font-bold text-[#1B3B2B]">
            {{ c.value }}
          </div>

          <div class="text-sm font-medium text-gray-500 mt-2">
            {{ c.label }}
          </div>
        </div>
      </div>
    </div>

    <!-- Management Modules -->
    <div>
      <h2 class="text-lg font-bold text-gray-800 mb-4">Management Modules</h2>

      <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <a
          *ngFor="let s of sections"
          [routerLink]="s.link"
          class="group bg-white border border-gray-200/80 rounded-2xl p-6 hover:border-[#1B3B2B] hover:shadow-md transition-all duration-200 flex flex-col justify-between"
        >
          <div>
            <h3
              class="text-base font-bold text-gray-800 group-hover:text-[#1B3B2B] transition-colors mb-2"
            >
              {{ s.title }}
            </h3>

            <p class="text-xs text-gray-500 leading-relaxed mb-4">
              {{ s.desc }}
            </p>
          </div>

          <div class="pt-3 border-t border-gray-100 flex items-center justify-end">
            <svg
              class="w-4 h-4 text-gray-400 group-hover:text-[#1B3B2B] group-hover:translate-x-1 transition-all"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </div>
        </a>
      </div>
    </div>
  </div>
</main>
