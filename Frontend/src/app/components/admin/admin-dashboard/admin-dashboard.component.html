<section class="wrap py-12">
  <h2 class="text-2xl mb-8">Admin Dashboard</h2>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-5 mb-12">
    <div class="border border-gray-100 rounded-xl p-6" *ngFor="let c of overview">
      <div class="font-heading font-extrabold text-3xl text-green-900 mb-1">{{ c.value }}</div>
      <div class="text-sm text-gray-600">{{ c.label }}</div>
    </div>
  </div>

  <div class="grid sm:grid-cols-2 md:grid-cols-4 gap-5">
    <a
      [routerLink]="s.link"
      class="border border-gray-100 rounded-xl p-6 hover:shadow-lg hover:border-mint-deep transition block"
      *ngFor="let s of sections"
    >
      <h3 class="text-base mb-1">{{ s.title }}</h3>
      <p class="text-sm text-gray-600 mb-3">{{ s.desc }}</p>
      <span class="text-xs font-semibold text-green-700">Owner: {{ s.owner }}</span>
    </a>
  </div>
</section>
