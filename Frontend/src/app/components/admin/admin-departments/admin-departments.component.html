<main class="min-h-screen bg-gray-50/50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b border-gray-200/80 pb-6">
      <div><h1 class="text-2xl md:text-3xl font-bold text-[#1B3B2B]">Departments</h1><p class="text-sm text-gray-500 mt-1">Add, edit, and deactivate hospital departments.</p></div>
      <button (click)="openAdd()" class="px-5 py-2.5 bg-[#1B3B2B] text-white rounded-xl text-sm font-semibold">Add Department</button>
    </div>
    <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">{{ errorMessage }}</div>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
      <article *ngFor="let d of departments" class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
        <img *ngIf="d.image" [src]="d.image" [alt]="d.name" class="w-full h-36 object-cover rounded-xl mb-4">
        <h2 class="font-bold text-lg text-[#1B3B2B]">{{ d.name }}</h2>
        <p class="text-sm text-gray-500 mt-2">{{ d.description }}</p>
        <div class="flex justify-end gap-3 mt-5 pt-4 border-t border-gray-100">
          <button (click)="openEdit(d)" class="text-[#1B3B2B] text-sm font-semibold">Edit</button>
          <button (click)="remove(d)" class="text-red-500 text-sm font-semibold">Deactivate</button>
        </div>
      </article>
    </div>
    <div *ngIf="loading" class="text-center py-12 text-gray-500">Loading departments...</div>
  </div>
</main>

<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <form (ngSubmit)="save()" class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 space-y-4">
    <div class="flex justify-between"><h2 class="text-lg font-bold text-[#1B3B2B]">{{ editingId ? 'Edit Department' : 'Add Department' }}</h2><button type="button" (click)="close()">&times;</button></div>
    <input [(ngModel)]="form.name" name="name" required placeholder="Department name" class="w-full px-3 py-2 border border-gray-200 rounded-lg">
    <textarea [(ngModel)]="form.description" name="description" required rows="3" placeholder="Description" class="w-full px-3 py-2 border border-gray-200 rounded-lg"></textarea>
    <input [(ngModel)]="form.image" name="image" required placeholder="Image URL" class="w-full px-3 py-2 border border-gray-200 rounded-lg">
    <div class="flex justify-end gap-3"><button type="button" (click)="close()" class="px-4 py-2 text-sm">Cancel</button><button type="submit" [disabled]="saving" class="px-5 py-2 bg-[#1B3B2B] text-white rounded-lg text-sm">{{ saving ? 'Saving...' : 'Save' }}</button></div>
  </form>
</div>
