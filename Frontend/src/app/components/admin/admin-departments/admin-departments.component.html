<section class="p-8">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-green-900">Departments</h1>
      <p class="text-gray-600 text-sm">Manage the hospital's departments.</p>
    </div>
    <button
      (click)="showAddForm = !showAddForm"
      class="bg-green-900 text-white text-sm px-4 py-2 rounded-lg"
    >
      {{ showAddForm ? 'Cancel' : '+ Add Department' }}
    </button>
  </div>

  <div *ngIf="errorMessage" class="text-red-600 text-sm mb-4">{{ errorMessage }}</div>

  <!-- Add form -->
  <div *ngIf="showAddForm" class="border border-gray-200 rounded-lg p-5 mb-6 grid gap-3 max-w-lg">
    <input [(ngModel)]="newDepartment.name" placeholder="Name" class="border rounded px-3 py-2 text-sm" />
    <textarea [(ngModel)]="newDepartment.description" placeholder="Description" class="border rounded px-3 py-2 text-sm"></textarea>
    <input [(ngModel)]="newDepartment.image" placeholder="Image path, e.g. /images/departments/cardiology.jpg" class="border rounded px-3 py-2 text-sm" />
    <button (click)="submitNewDepartment()" class="bg-green-900 text-white text-sm px-4 py-2 rounded-lg w-fit">Save</button>
  </div>

  <div *ngIf="loading" class="text-center text-gray-500 py-10">Loading departments...</div>

  <table *ngIf="!loading" class="w-full text-sm border border-gray-100 rounded-lg overflow-hidden">
    <thead class="bg-gray-50 text-left">
      <tr>
        <th class="p-3">Image</th>
        <th class="p-3">Name</th>
        <th class="p-3">Description</th>
        <th class="p-3">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let dept of departments" class="border-t border-gray-100">
        <ng-container *ngIf="editingId !== dept._id; else editRow">
          <td class="p-3"><img [src]="dept.image | imagePath" [alt]="dept.name" class="w-12 h-12 object-cover rounded" /></td>
          <td class="p-3">{{ dept.name }}</td>
          <td class="p-3 text-gray-600">{{ dept.description }}</td>
          <td class="p-3 space-x-2">
            <button (click)="startEdit(dept)" class="text-green-900 font-medium">Edit</button>
            <button (click)="deleteDepartment(dept)" class="text-red-600 font-medium">Delete</button>
          </td>
        </ng-container>

        <ng-template #editRow>
          <td class="p-3"><input [(ngModel)]="editDraft.image" class="border rounded px-2 py-1 text-xs w-full" /></td>
          <td class="p-3"><input [(ngModel)]="editDraft.name" class="border rounded px-2 py-1 text-xs w-full" /></td>
          <td class="p-3"><input [(ngModel)]="editDraft.description" class="border rounded px-2 py-1 text-xs w-full" /></td>
          <td class="p-3 space-x-2">
            <button (click)="saveEdit(dept)" [disabled]="savingId === dept._id" class="text-green-900 font-medium">
              {{ savingId === dept._id ? 'Saving...' : 'Save' }}
            </button>
            <button (click)="cancelEdit()" class="text-gray-500 font-medium">Cancel</button>
          </td>
        </ng-template>
      </tr>
    </tbody>
  </table>
</section>
