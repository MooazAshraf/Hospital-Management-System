<div
  class="bg-white border border-gray-200/80 rounded-2xl p-5 md:p-6 shadow-sm hover:shadow-md transition-shadow"
>

  <!-- ====================================== -->
  <!-- الرأس -->
  <!-- ====================================== -->

  <div
    class="flex items-start justify-between gap-4"
  >

    <div>

      <!-- رقم الانتظار -->
      <div
        *ngIf="queueNumber"
        class="text-sm text-gray-400 mb-2"
      >
        رقم الانتظار: {{ queueNumber }}
      </div>

      <!-- الطبيب -->
      <div
        class="text-xs text-gray-400 mb-1"
      >
        الطبيب
      </div>

      <h3
        class="text-lg md:text-xl font-bold text-[#1B3B2B]"
      >
        {{ doctorName }}
      </h3>

    </div>

    <!-- حالة الموعد -->
    <span
      *ngIf="statusLabel"
      class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap"
      [ngClass]="statusClass"
    >
      {{ statusLabel }}
    </span>

  </div>


  <!-- ====================================== -->
  <!-- معلومات الموعد -->
  <!-- ====================================== -->

  <div
    class="mt-5 space-y-3"
  >

    <!-- التاريخ والوقت -->

    <div
      class="flex items-center gap-3 text-gray-700"
    >

      <svg
        class="w-5 h-5 text-[#1B3B2B] shrink-0"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        ></path>
      </svg>

      <span class="font-medium">
        {{ formattedDate }}
      </span>

      <span class="text-gray-400">
        —
      </span>

      <span class="font-medium">
        {{ formattedTime }}
      </span>

    </div>


    <!-- نوع الموعد -->

    <div
      *ngIf="appointmentType"
      class="text-sm text-gray-500"
    >
      نوع الموعد: {{ appointmentType }}
    </div>


    <!-- الملاحظات -->

    <div
      *ngIf="appointment?.notes"
      class="text-sm text-gray-500"
    >
      الملاحظات: {{ appointment.notes }}
    </div>

  </div>


  <!-- ====================================== -->
  <!-- إلغاء الموعد -->
  <!-- ====================================== -->

  <div
    *ngIf="
      appointment?.status !== 'Cancelled' &&
      appointment?.status !== 'Completed'
    "
    class="mt-5 pt-4 border-t border-gray-100 flex justify-end"
  >

    <button
      type="button"
      (click)="cancelAppointment()"
      class="px-4 py-2 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 transition-colors"
    >
      إلغاء الموعد
    </button>

  </div>

</div>
