<section class="booking-page">

  <!-- =========================
       STEP 1: CHOOSE DOCTOR
  ========================== -->
  <div *ngIf="!selectedDoctor()" class="doctor-selection">

    <div class="page-header">
      <h1>Choose a Doctor</h1>

      <p>
        Pick a doctor to start booking your appointment.
      </p>
    </div>

    <!-- Search -->
    <div class="search-box">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="19"
        height="19"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>

      <input
        type="text"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        placeholder="Search by doctor name or specialty..."
      />

    </div>


    <!-- Loading -->
    <div
      *ngIf="isLoading()"
      class="status-message"
    >
      Loading doctors...
    </div>


    <!-- Error -->
    <div
      *ngIf="!isLoading() && errorMessage()"
      class="status-message error-message"
    >
      {{ errorMessage() }}
    </div>


    <!-- No doctors -->
    <div
      *ngIf="
        !isLoading() &&
        !errorMessage() &&
        filteredDoctors().length === 0
      "
      class="status-message"
    >
      No doctors match your search.
    </div>


    <!-- Doctors -->
    <div
      *ngIf="
        !isLoading() &&
        !errorMessage() &&
        filteredDoctors().length > 0
      "
      class="doctors-grid"
    >

      <article
        *ngFor="let doctor of filteredDoctors()"
        class="doctor-card"
        (click)="selectDoctor(doctor)"
      >

        <!-- Doctor Image -->
        <div class="doctor-image">

          <img
            *ngIf="doctor.image"
            [src]="doctor.image | imagePath"
            [alt]="doctor.name"
          />

          <div
            *ngIf="!doctor.image"
            class="doctor-placeholder"
          >
            👨‍⚕️
          </div>

        </div>


        <!-- Doctor Info -->
        <div class="doctor-content">

          <div class="doctor-top">

            <div>

              <h2>
                Dr. {{ doctor.name }}
              </h2>

              <p>
                {{ doctor.specialty }}
              </p>

            </div>


            <span
              class="availability"
              [class.available]="doctor.isAvailable"
              [class.unavailable]="!doctor.isAvailable"
            >
              {{ doctor.isAvailable ? 'Available' : 'Unavailable' }}
            </span>

          </div>


          <div class="doctor-bottom">

            <span class="doctor-fees">
              {{ doctor.fees }} EGP
            </span>

            <button
              type="button"
              class="select-button"
              (click)="$event.stopPropagation(); selectDoctor(doctor)"
            >
              Book Now
            </button>

          </div>

        </div>

      </article>

    </div>

  </div>



  <!-- =========================
       STEP 2: BOOK APPOINTMENT
  ========================== -->

  <div
    *ngIf="selectedDoctor() as doctor"
    class="booking-container"
  >

    <!-- Back / Change Doctor -->
    <button
      type="button"
      class="change-doctor-button"
      (click)="changeDoctor()"
    >
      <span>←</span>
      Choose a different doctor
    </button>


    <!-- Booking Form Component -->
    <app-booking-steps
      [doctorId]="doctor._id"
      [doctorName]="doctor.name"
      [doctorImage]="doctor.image ?? ''"
      [doctorSpecialty]="doctor.specialty ?? ''"
      [doctorFees]="doctor.fees ?? null"
      (booked)="onBooked($event)"
    >
    </app-booking-steps>

  </div>

</section>


<style>

/* =========================================
   PAGE
========================================= */

.booking-page {
  width: 100%;
  min-height: 100vh;
  background: #ffffff;
  padding: 50px 30px 80px;
  box-sizing: border-box;
}


/* =========================================
   DOCTOR SELECTION
========================================= */

.doctor-selection {
  width: min(1150px, 100%);
  margin: 0 auto;
}


/* =========================================
   HEADER
========================================= */

.page-header {
  margin-bottom: 28px;
}

.page-header h1 {
  margin: 0;
  color: #173f29;
  font-size: 32px;
  font-weight: 800;
}

.page-header p {
  margin: 8px 0 0;
  color: #7a8580;
  font-size: 15px;
}


/* =========================================
   SEARCH
========================================= */

.search-box {
  width: min(500px, 100%);
  height: 48px;

  display: flex;
  align-items: center;

  gap: 10px;

  padding: 0 15px;

  margin-bottom: 35px;

  border: 1px solid #dfe6e1;
  border-radius: 12px;

  background: #ffffff;

  box-sizing: border-box;

  transition: 0.2s;
}

.search-box:focus-within {
  border-color: #1f6f5c;
  box-shadow: 0 0 0 3px rgba(31, 111, 92, 0.08);
}

.search-box svg {
  color: #9aa49f;
  flex-shrink: 0;
}

.search-box input {
  width: 100%;

  border: none;
  outline: none;

  background: transparent;

  font-family: inherit;
  font-size: 14px;

  color: #26352d;
}

.search-box input::placeholder {
  color: #a4aca8;
}


/* =========================================
   STATUS
========================================= */

.status-message {
  padding: 50px 20px;

  text-align: center;

  color: #7a8580;

  font-size: 15px;
}

.error-message {
  color: #c0392b;
}


/* =========================================
   DOCTORS GRID
========================================= */

.doctors-grid {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 24px;
}


/* =========================================
   DOCTOR CARD
========================================= */

.doctor-card {
  overflow: hidden;

  background: #ffffff;

  border: 1px solid #e3e9e5;

  border-radius: 18px;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    border-color 0.2s ease;
}

.doctor-card:hover {
  transform: translateY(-4px);

  border-color: #cbdad1;

  box-shadow:
    0 12px 30px rgba(20, 83, 45, 0.10);
}


/* =========================================
   DOCTOR IMAGE
========================================= */

.doctor-image {
  width: 100%;
  height: 220px;

  background: #f4f8f5;

  overflow: hidden;
}

.doctor-image img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;
}

.doctor-placeholder {
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 60px;

  background: #f1f7f3;
}


/* =========================================
   DOCTOR CONTENT
========================================= */

.doctor-content {
  padding: 20px;
}


/* =========================================
   TOP
========================================= */

.doctor-top {
  display: flex;

  align-items: flex-start;

  justify-content: space-between;

  gap: 15px;
}

.doctor-top h2 {
  margin: 0;

  color: #173f29;

  font-size: 18px;

  font-weight: 800;
}

.doctor-top p {
  margin: 6px 0 0;

  color: #39745b;

  font-size: 14px;
}


/* =========================================
   AVAILABILITY
========================================= */

.availability {
  flex-shrink: 0;

  padding: 5px 9px;

  border-radius: 999px;

  font-size: 11px;

  font-weight: 700;
}

.availability.available {
  color: #18794e;
  background: #e9f7ef;
}

.availability.unavailable {
  color: #b42318;
  background: #fff0ef;
}


/* =========================================
   BOTTOM
========================================= */

.doctor-bottom {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  margin-top: 20px;

  padding-top: 16px;

  border-top: 1px solid #edf0ee;
}

.doctor-fees {
  color: #34423a;

  font-size: 14px;

  font-weight: 700;
}


/* =========================================
   BOOK NOW BUTTON
========================================= */

.select-button {
  border: none;

  padding: 10px 18px;

  border-radius: 9px;

  background: #1d432b;

  color: #ffffff;

  font-family: inherit;

  font-size: 13px;

  font-weight: 700;

  cursor: pointer;

  transition: 0.2s;
}

.select-button:hover {
  background: #163722;

  transform: translateY(-1px);
}


/* =========================================
   BOOKING CONTAINER
========================================= */

.booking-container {
  width: min(800px, 100%);

  margin: 0 auto;
}


/* =========================================
   CHANGE DOCTOR BUTTON
========================================= */

.change-doctor-button {
  display: inline-flex;

  align-items: center;

  gap: 8px;

  margin-bottom: 20px;

  padding: 10px 16px;

  border: 1px solid #dce5df;

  border-radius: 9px;

  background: #ffffff;

  color: #1d432b;

  font-family: inherit;

  font-size: 13px;

  font-weight: 700;

  cursor: pointer;

  transition: 0.2s;
}

.change-doctor-button span {
  font-size: 17px;
}

.change-doctor-button:hover {
  background: #f3f8f5;

  border-color: #1f6f5c;

  transform: translateX(-2px);
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 950px) {

  .doctors-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

}


@media (max-width: 650px) {

  .booking-page {
    padding: 30px 15px 60px;
  }

  .page-header h1 {
    font-size: 27px;
  }

  .doctors-grid {
    grid-template-columns: 1fr;
  }

  .doctor-image {
    height: 230px;
  }

  .booking-container {
    width: 100%;
  }

}

</style>
