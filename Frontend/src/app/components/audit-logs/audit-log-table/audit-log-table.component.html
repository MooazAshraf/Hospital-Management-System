<section class="wrap py-16">
  <h2 class="text-2xl mb-4">Audit Logs</h2>

  <p *ngIf="loading" class="text-gray-600">
    Loading audit logs...
  </p>

  <p *ngIf="error" class="text-red-600">
    {{ error }}
  </p>

  <div *ngIf="!loading && !error" class="overflow-x-auto">
    <table class="w-full border-collapse border border-gray-300">
      <thead>
        <tr class="bg-gray-100">
          <th class="border border-gray-300 p-3 text-left">Actor</th>
          <th class="border border-gray-300 p-3 text-left">Action</th>
          <th class="border border-gray-300 p-3 text-left">
            Target Collection
          </th>
          <th class="border border-gray-300 p-3 text-left">Target ID</th>
          <th class="border border-gray-300 p-3 text-left">Timestamp</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let log of auditLogs">
          <td class="border border-gray-300 p-3">
            {{ log.performedBy?.name || 'Unknown' }}
          </td>

          <td class="border border-gray-300 p-3">
            {{ log.action }}
          </td>

          <td class="border border-gray-300 p-3">
            {{ log.collectionName }}
          </td>

          <td class="border border-gray-300 p-3">
            {{ log.documentId }}
          </td>

          <td class="border border-gray-300 p-3">
            {{ log.createdAt | date:'medium' }}
          </td>
        </tr>

        <tr *ngIf="auditLogs.length === 0">
          <td colspan="5" class="p-4 text-center text-gray-500">
            No audit logs found.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
