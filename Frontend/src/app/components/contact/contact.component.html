<style>
  .contact-page {
    min-height: 100vh;
    padding: 50px 20px;
    background: #f4f8f7;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .contact-container {
    width: 100%;
    max-width: 850px;
    background: #ffffff;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
  }

  /* Header */
  .contact-header {
    text-align: center;
    margin-bottom: 35px;
  }

  .icon-box {
    width: 70px;
    height: 70px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: #e8f7f3;
    color: #0b8f78;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }

  .contact-header h1 {
    margin: 0 0 10px;
    color: #1f2937;
    font-size: 34px;
    font-weight: 700;
  }

  .contact-header p {
    margin: 0;
    color: #6b7280;
    font-size: 16px;
  }

  /* Form */
  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-group label {
    color: #374151;
    font-size: 15px;
    font-weight: 600;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 13px 15px;
    font-size: 15px;
    font-family: inherit;
    color: #1f2937;
    background: #ffffff;
    outline: none;
    transition: 0.2s ease;
  }

  .form-group input {
    height: 48px;
  }

  .form-group textarea {
    min-height: 140px;
    resize: vertical;
  }

  .form-group input::placeholder,
  .form-group textarea::placeholder {
    color: #9ca3af;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: #0b8f78;
    box-shadow: 0 0 0 3px rgba(11, 143, 120, 0.1);
  }

  /* Validation errors */
  .error {
    color: #dc2626;
    font-size: 13px;
    margin-top: 2px;
  }

  /* Success message */
  .success-message {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 10px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: #047857;
    font-size: 14px;
    font-weight: 500;
  }

  .success-message span {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #10b981;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  /* Error message */
  .error-message {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 10px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-size: 14px;
    font-weight: 500;
  }

  .error-message span {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ef4444;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  /* Submit button */
  .submit-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 10px;
    background: #0b8f78;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .submit-btn:hover:not(:disabled) {
    background: #087663;
    transform: translateY(-1px);
  }

  .submit-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .submit-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .contact-page {
      padding: 30px 15px;
    }

    .contact-container {
      padding: 25px 20px;
      border-radius: 15px;
    }

    .contact-header h1 {
      font-size: 28px;
    }
  }

  @media (max-width: 480px) {
    .contact-page {
      padding: 20px 10px;
    }

    .contact-container {
      padding: 22px 15px;
    }

    .contact-header h1 {
      font-size: 25px;
    }

    .contact-header p {
      font-size: 14px;
    }
  }
</style>


<div class="contact-page">

  <div class="contact-container">

    <!-- Header -->
    <div class="contact-header">

      <div class="icon-box">
        ✉
      </div>

      <h1>
        Contact Us
      </h1>

      <p>
        Have a question or need help? Send us a message.
      </p>

    </div>

    <!-- Form -->
    <form
      [formGroup]="contactForm"
      (ngSubmit)="sendMessage()"
      class="contact-form"
    >

      <!-- Name -->
      <div class="form-group">

        <label for="name">
          Name
        </label>

        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Enter your name"
        />

        <small
          class="error"
          *ngIf="name?.touched && name?.hasError('required')"
        >
          Name is required.
        </small>

      </div>

      <!-- Email -->
      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
        />

        <small
          class="error"
          *ngIf="email?.touched && email?.hasError('required')"
        >
          Email is required.
        </small>

        <small
          class="error"
          *ngIf="email?.touched && email?.hasError('email')"
        >
          Please enter a valid email.
        </small>

      </div>

      <!-- Phone -->
      <div class="form-group">

        <label for="phone">
          Phone
        </label>

        <input
          id="phone"
          type="tel"
          formControlName="phone"
          placeholder="Enter your phone number"
        />

      </div>

      <!-- Subject -->
      <div class="form-group">

        <label for="subject">
          Subject
        </label>

        <input
          id="subject"
          type="text"
          formControlName="subject"
          placeholder="Enter message subject"
        />

        <small
          class="error"
          *ngIf="subject?.touched && subject?.hasError('required')"
        >
          Subject is required.
        </small>

      </div>

      <!-- Message -->
      <div class="form-group">

        <label for="message">
          Message
        </label>

        <textarea
          id="message"
          rows="6"
          formControlName="message"
          placeholder="Write your message..."
        ></textarea>

        <small
          class="error"
          *ngIf="message?.touched && message?.hasError('required')"
        >
          Message is required.
        </small>

        <small
          class="error"
          *ngIf="message?.touched && message?.hasError('minlength')"
        >
          Message must be at least 10 characters.
        </small>

      </div>

      <!-- Success -->
      <div
        class="success-message"
        *ngIf="successMessage"
      >
        <span>✓</span>

        {{ successMessage }}
      </div>

      <!-- Error -->
      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        <span>!</span>

        {{ errorMessage }}
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="submit-btn"
        [disabled]="isLoading"
      >

        <span *ngIf="!isLoading">
          Send Message
        </span>

        <span *ngIf="isLoading">
          Sending...
        </span>

      </button>

    </form>

  </div>

</div>
