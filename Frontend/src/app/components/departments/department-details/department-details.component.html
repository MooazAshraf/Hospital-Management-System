<div class="wrap py-16">

  <!-- Department Info -->
  <div
    *ngIf="department"
    class="bg-white border border-gray-100 rounded-2xl overflow-hidden"
  >
    <img
      *ngIf="department.image"
      [src]="department.image | imagePath"
      [alt]="department.name"
      class="w-full h-64 object-cover"
    />

    <div class="p-8">
      <h1 class="text-3xl font-bold text-[#1B3B2B] mb-4">
        {{ department.name }}
      </h1>

      <p class="text-gray-600">
        {{ department.description }}
      </p>
    </div>
  </div>


  <!-- Doctors -->
  <section class="mt-12">

    <h2 class="text-2xl font-bold text-[#1B3B2B] mb-6">
      Doctors in {{ department?.name }}
    </h2>

    <div
      *ngIf="doctorsErrorMessage"
      class="text-red-600 py-6"
    >
      {{ doctorsErrorMessage }}
    </div>

    <div
      *ngIf="!doctorsErrorMessage && doctors.length === 0"
      class="text-gray-500 py-6"
    >
      No doctors found in this department.
    </div>

    <div
      *ngIf="doctors.length > 0"
      class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"
    >

      <app-doctor-card
        *ngFor="let doctor of doctors"
        [doctor]="doctor"
      ></app-doctor-card>

    </div>

  </section>

</div>
