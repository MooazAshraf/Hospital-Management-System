<section class="py-20" id="departments">
  <div class="wrap">
    <div class="section-head">
      <h2 class="text-3xl md:text-4xl max-w-lg">Find the right department for your visit</h2>
      <p class="text-gray-600 max-w-sm text-[15px]">Each department is staffed by specialists who work from the same patient record.</p>
    </div>

    <div *ngIf="loading" class="text-center text-gray-500 py-10">Loading departments...</div>

    <div *ngIf="!loading && errorMessage" class="text-center text-red-600 py-10">{{ errorMessage }}</div>

    <div *ngIf="!loading && !errorMessage" class="grid sm:grid-cols-2 md:grid-cols-3 gap-5">
      <app-department-card *ngFor="let d of departments" [department]="d"></app-department-card>
    </div>
  </div>
</section>
