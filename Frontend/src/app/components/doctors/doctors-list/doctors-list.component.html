<section class="p-6 max-w-5xl mx-auto">

  <div class="mb-6">
    <h1 class="text-2xl font-bold text-green-900">
      Our Doctors
    </h1>

    <p class="text-gray-500 mt-1">
      Find the right doctor for your needs.
    </p>
  </div>


  <!-- Search + Filter -->
  <div class="flex flex-col sm:flex-row gap-4 mb-8 max-w-2xl">

    <div class="relative flex-1">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>

      <input
        type="text"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        placeholder="Search by doctor name or department..."
        class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200
               focus:outline-none focus:ring-2 focus:ring-green-900/20
               focus:border-green-900 transition"
      />
    </div>

    <select
      [ngModel]="selectedDepartment()"
      (ngModelChange)="selectedDepartment.set($event)"
      class="sm:w-56 py-3 px-4 rounded-xl border border-gray-200
             focus:outline-none focus:ring-2 focus:ring-green-900/20
             focus:border-green-900 transition text-gray-700"
    >
      <option value="">All departments</option>
      <option *ngFor="let dept of departments()" [value]="dept">
        {{ dept }}
      </option>
    </select>

  </div>


  <!-- Loading -->
  <div
    *ngIf="isLoading()"
    class="text-center py-10 text-gray-500"
  >
    Loading doctors...
  </div>


  <!-- Error -->
  <div
    *ngIf="!isLoading() && errorMessage()"
    class="text-center py-10 text-red-600"
  >
    {{ errorMessage() }}
  </div>


  <!-- Empty (no doctors at all) -->
  <div
    *ngIf="
      !isLoading() &&
      !errorMessage() &&
      doctors().length === 0
    "
    class="text-center py-10 text-gray-500"
  >
    No doctors found.
  </div>


  <!-- No search/filter results -->
  <div
    *ngIf="
      !isLoading() &&
      !errorMessage() &&
      doctors().length > 0 &&
      filteredDoctors().length === 0
    "
    class="text-center py-10 text-gray-500"
  >
    No doctors match your search.
  </div>


  <!-- Doctors -->
  <div
    *ngIf="
      !isLoading() &&
      !errorMessage() &&
      filteredDoctors().length > 0
    "
    class="grid
           grid-cols-1
           md:grid-cols-2
           lg:grid-cols-3
           gap-6"
  >

    <app-doctor-card
      *ngFor="let doctor of filteredDoctors()"
      [doctor]="doctor"
    />

  </div>

</section>
