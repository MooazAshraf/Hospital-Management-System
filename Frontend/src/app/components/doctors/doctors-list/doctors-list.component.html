<section
  dir="rtl"
  class="p-6 max-w-5xl mx-auto"
>

  <div class="mb-6">

    <h1 class="text-2xl font-bold text-green-900">
      أطباؤنا
    </h1>

    <p class="text-gray-500 mt-1">
      ابحث عن الطبيب المناسب لاحتياجاتك.
    </p>

  </div>


  <!-- البحث + الفلترة -->
  <div
    class="flex flex-col sm:flex-row gap-4 mb-8 max-w-2xl"
  >

    <div class="relative flex-1">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>

      <input
        type="text"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        placeholder="ابحث باسم الطبيب أو القسم..."
        class="w-full pr-10 pl-4 py-3 rounded-xl border border-gray-200
               focus:outline-none focus:ring-2 focus:ring-green-900/20
               focus:border-green-900 transition"
      />

    </div>


    <select
      [ngModel]="selectedDepartment()"
      (ngModelChange)="selectedDepartment.set($event)"
      class="sm:w-56 py-3 px-4 rounded-xl border border-gray-200
             focus:outline-none focus:ring-2 focus:ring-green-900/20
             focus:border-green-900 transition text-gray-700"
    >

      <option value="">
        جميع الأقسام
      </option>

      <option
        *ngFor="let dept of departments()"
        [value]="dept"
      >
        {{ dept }}
      </option>

    </select>

  </div>


  <!-- جاري التحميل -->
  <div
    *ngIf="isLoading()"
    class="text-center py-10 text-gray-500"
  >
    جاري تحميل الأطباء...
  </div>


  <!-- خطأ -->
  <div
    *ngIf="!isLoading() && errorMessage()"
    class="text-center py-10 text-red-600"
  >
    {{ errorMessage() }}
  </div>


  <!-- لا يوجد أطباء -->
  <div
    *ngIf="
      !isLoading() &&
      !errorMessage() &&
      doctors().length === 0
    "
    class="text-center py-10 text-gray-500"
  >
    لم يتم العثور على أطباء.
  </div>


  <!-- لا توجد نتائج للبحث أو الفلترة -->
  <div
    *ngIf="
      !isLoading() &&
      !errorMessage() &&
      doctors().length > 0 &&
      filteredDoctors().length === 0
    "
    class="text-center py-10 text-gray-500"
  >
    لا يوجد أطباء مطابقون لبحثك.
  </div>


  <!-- الأطباء -->
  <div
    *ngIf="
      !isLoading() &&
      !errorMessage() &&
      filteredDoctors().length > 0
    "
    class="grid
           grid-cols-1
           md:grid-cols-2
           lg:grid-cols-3
           gap-6"
  >

    <app-doctor-card
      *ngFor="let doctor of filteredDoctors()"
      [doctor]="doctor"
    />

  </div>

</section>
