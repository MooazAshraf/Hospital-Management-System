<section class="min-h-screen bg-gray-50 py-10 px-6">

  <div class="max-w-7xl mx-auto">


    <!-- Header -->
    <div class="mb-8">

      <h1
        class="text-3xl
               font-bold
               text-green-900"
      >
        Our Doctors
      </h1>

      <p class="text-gray-500 mt-2">
        Find the right doctor for your needs.
      </p>

    </div>


    <!-- Search & Filter -->
    <div
      class="bg-white
             rounded-2xl
             border
             border-gray-100
             shadow-sm
             p-5
             mb-8"
    >

      <div
        class="grid
               grid-cols-1
               md:grid-cols-3
               gap-4"
      >


        <!-- Search -->
        <div class="md:col-span-2">

          <label
            class="block
                   text-sm
                   font-semibold
                   text-gray-700
                   mb-2"
          >
            Search Doctor
          </label>


          <div class="relative">

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="absolute
                     left-4
                     top-1/2
                     -translate-y-1/2
                     text-gray-400"
            >

              <circle
                cx="11"
                cy="11"
                r="8"
              />

              <path
                d="m21 21-4.3-4.3"
              />

            </svg>


            <input
              type="text"
              [ngModel]="searchTerm()"
              (ngModelChange)="searchTerm.set($event)"
              placeholder="Search by doctor name or department..."
              class="w-full
                     pl-11
                     pr-4
                     py-3
                     rounded-xl
                     border
                     border-gray-200
                     bg-white
                     text-gray-800
                     placeholder-gray-400
                     focus:outline-none
                     focus:ring-2
                     focus:ring-green-900/20
                     focus:border-green-900
                     transition"
            />

          </div>

        </div>


        <!-- Department -->
        <div>

          <label
            class="block
                   text-sm
                   font-semibold
                   text-gray-700
                   mb-2"
          >
            Department
          </label>


          <select
            [ngModel]="selectedDepartment()"
            (ngModelChange)="selectedDepartment.set($event)"
            class="w-full
                   py-3
                   px-4
                   rounded-xl
                   border
                   border-gray-200
                   bg-white
                   text-gray-700
                   focus:outline-none
                   focus:ring-2
                   focus:ring-green-900/20
                   focus:border-green-900
                   transition"
          >

            <option value="">
              All Departments
            </option>


            <option
              *ngFor="let department of departments()"
              [value]="department"
            >
              {{ department }}
            </option>

          </select>

        </div>

      </div>


      <!-- Filter Info -->
      <div
        class="flex
               items-center
               justify-between
               mt-4
               pt-4
               border-t
               border-gray-100"
      >

        <p class="text-sm text-gray-500">

          Showing

          <span
            class="font-bold
                   text-green-900"
          >
            {{ filteredDoctors().length }}
          </span>

          doctors

        </p>


        <button
          *ngIf="
            searchTerm() ||
            selectedDepartment()
          "
          type="button"
          (click)="clearFilters()"
          class="text-sm
                 font-semibold
                 text-green-900
                 hover:text-green-700
                 transition"
        >
          Clear Filters
        </button>

      </div>

    </div>


    <!-- Loading -->
    <div
      *ngIf="isLoading()"
      class="text-center
             py-16
             text-gray-500"
    >

      <div
        class="inline-block
               w-8
               h-8
               border-4
               border-gray-200
               border-t-green-900
               rounded-full
               animate-spin
               mb-4"
      ></div>

      <p>
        Loading doctors...
      </p>

    </div>


    <!-- Error -->
    <div
      *ngIf="
        !isLoading() &&
        errorMessage()
      "
      class="bg-red-50
             border
             border-red-100
             text-red-600
             rounded-xl
             p-5
             text-center"
    >

      {{ errorMessage() }}

    </div>


    <!-- No Doctors -->
    <div
      *ngIf="
        !isLoading() &&
        !errorMessage() &&
        doctors().length === 0
      "
      class="bg-white
             rounded-2xl
             border
             border-gray-100
             p-12
             text-center
             text-gray-500"
    >

      No doctors found.

    </div>


    <!-- No Search Result -->
    <div
      *ngIf="
        !isLoading() &&
        !errorMessage() &&
        doctors().length > 0 &&
        filteredDoctors().length === 0
      "
      class="bg-white
             rounded-2xl
             border
             border-gray-100
             p-12
             text-center"
    >

      <div class="text-5xl mb-4">
        🔍
      </div>


      <h3
        class="text-lg
               font-semibold
               text-gray-800"
      >
        No doctors found
      </h3>


      <p class="text-gray-500 mt-2">
        Try another doctor name or department.
      </p>


      <button
        type="button"
        (click)="clearFilters()"
        class="mt-5
               px-6
               py-2.5
               rounded-lg
               bg-green-900
               text-white
               font-semibold
               hover:bg-green-800
               transition"
      >
        Clear Filters
      </button>

    </div>


    <!-- Doctors -->
    <div
      *ngIf="
        !isLoading() &&
        !errorMessage() &&
        filteredDoctors().length > 0
      "
      class="grid
             grid-cols-1
             md:grid-cols-2
             lg:grid-cols-3
             gap-6"
    >

      <app-doctor-card
        *ngFor="let doctor of filteredDoctors()"
        [doctor]="doctor"
      />

    </div>

  </div>

</section>
