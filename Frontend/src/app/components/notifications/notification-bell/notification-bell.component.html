<section
  #notificationContainer
  dir="rtl"
  class="relative inline-block"
>
  <!-- ==================== زر الإشعارات ==================== -->
  <button
    type="button"
    (click)="toggleDropdown($event)"
    class="relative w-10 h-10 rounded-full border border-gray-100
           bg-white flex items-center justify-center
           hover:bg-gray-50 hover:shadow-sm
           transition-all duration-200"
    aria-label="الإشعارات"
  >
    <!-- الجرس -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-5 h-5 text-green-900"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0a3 3 0 11-6 0m6 0H9"
      />
    </svg>

    <!-- عدد الإشعارات غير المقروءة -->
    <span
      *ngIf="unreadCount > 0"
      class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1
             rounded-full bg-mint text-green-900
             text-[10px] font-bold
             flex items-center justify-center"
    >
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <!-- ==================== القائمة المنسدلة ==================== -->
  <div
    *ngIf="isOpen"
    (click)="$event.stopPropagation()"
    class="absolute left-0 mt-3 w-96 max-w-[90vw]
           bg-white border border-gray-100
           rounded-2xl shadow-xl
           z-50 overflow-hidden"
  >
    <!-- ==================== العنوان ==================== -->
    <div
      class="flex items-center justify-between
             px-4 py-3 border-b border-gray-100"
    >
      <div>
        <h3 class="text-sm font-bold text-green-900">
          الإشعارات
        </h3>

        <p
          *ngIf="unreadCount > 0"
          class="text-xs text-gray-500 mt-0.5"
        >
          {{ unreadCount }}
          إشعار غير مقروء
        </p>

        <p
          *ngIf="unreadCount === 0"
          class="text-xs text-gray-500 mt-0.5"
        >
          لا توجد إشعارات جديدة
        </p>
      </div>

      <div class="flex items-center gap-2">
        <!-- تحديث -->
        <button
          type="button"
          (click)="refreshNotifications($event)"
          [disabled]="isLoading"
          class="w-8 h-8 rounded-lg
                 flex items-center justify-center
                 text-gray-500
                 hover:text-green-900
                 hover:bg-gray-50
                 transition
                 disabled:opacity-40"
          title="تحديث الإشعارات"
        >
          ↻
        </button>

        <!-- تحديد الكل كمقروء -->
        <button
          *ngIf="unreadCount > 0"
          type="button"
          (click)="markAllAsRead()"
          [disabled]="isMarkingAll"
          class="text-xs text-green-700
                 font-semibold
                 hover:text-green-900
                 disabled:opacity-50"
        >
          {{
            isMarkingAll
              ? 'جاري التحديث...'
              : 'تحديد الكل كمقروء'
          }}
        </button>
      </div>
    </div>

    <!-- ==================== التحميل ==================== -->
    <div
      *ngIf="isLoading"
      class="px-4 py-10 text-center"
    >
      <div
        class="inline-block w-6 h-6
               border-2 border-gray-200
               border-t-green-900
               rounded-full animate-spin"
      ></div>

      <p class="text-sm text-gray-500 mt-3">
        جاري تحميل الإشعارات...
      </p>
    </div>

    <!-- ==================== الخطأ ==================== -->
    <div
      *ngIf="!isLoading && errorMessage"
      class="px-4 py-8 text-center"
    >
      <div class="text-2xl mb-2">
        ⚠️
      </div>

      <p class="text-sm text-red-600">
        {{ errorMessage }}
      </p>

      <button
        type="button"
        (click)="loadNotifications()"
        class="mt-3 text-xs
               text-green-700
               font-semibold
               hover:text-green-900"
      >
        حاول مرة أخرى
      </button>
    </div>

    <!-- ==================== لا توجد إشعارات ==================== -->
    <div
      *ngIf="
        !isLoading &&
        !errorMessage &&
        notifications.length === 0
      "
      class="px-4 py-10 text-center"
    >
      <div class="text-3xl mb-2">
        🔔
      </div>

      <p class="text-sm font-semibold text-gray-700">
        لا توجد إشعارات حتى الآن
      </p>

      <p class="text-xs text-gray-400 mt-1">
        سنرسل لك إشعارًا عند حدوث أي جديد.
      </p>
    </div>

    <!-- ==================== الإشعارات ==================== -->
    <div
      *ngIf="
        !isLoading &&
        !errorMessage &&
        notifications.length > 0
      "
      class="max-h-[420px] overflow-y-auto"
    >
      <div
        *ngFor="let n of notifications; trackBy: trackByNotificationId"
        class="group relative
               border-b border-gray-50
               last:border-b-0
               transition-colors duration-150"
        [class.bg-green-50]="!n.isRead"
      >
        <!-- زر الإشعار -->
        <button
          type="button"
          (click)="onNotificationClick(n)"
          class="w-full text-right
                 px-4 py-3
                 hover:bg-gray-50
                 transition-colors duration-150"
        >
          <div class="flex gap-3">
            <!-- أيقونة الإشعار -->
            <div
              class="w-10 h-10 rounded-full
                     bg-white
                     border border-gray-100
                     flex items-center justify-center
                     shrink-0 text-lg"
            >
              {{ getNotificationIcon(n.type) }}
            </div>

            <!-- محتوى الإشعار -->
            <div class="flex-1 min-w-0 pl-6">
              <!-- العنوان + غير مقروء -->
              <div
                class="flex items-start
                       justify-between
                       gap-2"
              >
                <span
                  class="text-sm text-green-900"
                  [class.font-bold]="!n.isRead"
                  [class.font-semibold]="n.isRead"
                >
                  {{ n.title }}
                </span>

                <!-- نقطة عدم القراءة -->
                <span
                  *ngIf="!n.isRead"
                  class="w-2 h-2
                         rounded-full
                         bg-green-700
                         shrink-0
                         mt-1.5"
                ></span>
              </div>

              <!-- الرسالة -->
              <p
                class="text-xs text-gray-600
                       mt-1
                       leading-relaxed"
              >
                {{ n.message }}
              </p>

              <!-- النوع والتاريخ -->
              <div class="mt-2 flex items-center gap-2">
                <span
                  class="text-[10px]
                         px-2 py-0.5
                         rounded-full
                         bg-gray-100
                         text-gray-500"
                >
                  {{ n.type }}
                </span>

                <!-- التاريخ -->
                <span
                  class="text-[10px]
                         text-gray-400"
                >
                  {{ formatDate(n.createdAt) }}
                </span>
              </div>
            </div>
          </div>
        </button>

        <!-- حذف الإشعار -->
        <button
          type="button"
          (click)="deleteNotification(n, $event)"
          class="absolute
                 left-3 bottom-3
                 w-7 h-7
                 rounded-md
                 flex items-center justify-center
                 text-gray-300
                 opacity-0
                 group-hover:opacity-100
                 hover:text-red-600
                 hover:bg-red-50
                 transition-all duration-150"
          title="حذف الإشعار"
        >
          ×
        </button>
      </div>
    </div>
  </div>
</section>
