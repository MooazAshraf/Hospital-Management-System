<section class="relative inline-block">
  <button type="button" (click)="toggleDropdown()"
    class="relative w-10 h-10 rounded-full border border-gray-100 flex items-center justify-center">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-green-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0a3 3 0 11-6 0m6 0H9" />
    </svg>

    <span *ngIf="unreadCount > 0"
      class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-mint text-green-900 text-[10px] font-semibold flex items-center justify-center">
      {{ unreadCount }}
    </span>
  </button>

  <div *ngIf="isOpen" class="absolute right-0 mt-2 w-80 border border-gray-100 rounded-xl bg-white shadow-lg z-10">
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
      <h3 class="text-sm font-semibold text-green-900">Notifications</h3>
      <button type="button" (click)="markAllAsRead()" *ngIf="unreadCount > 0"
        class="text-xs text-green-700 font-semibold">
        Mark all as read
      </button>
    </div>

    <div class="max-h-80 overflow-y-auto">
      <p *ngIf="isLoading" class="text-sm text-gray-500 px-4 py-4">Loading...</p>
      <p *ngIf="errorMessage" class="text-sm text-red-600 px-4 py-4">{{ errorMessage }}</p>
      <p *ngIf="!isLoading && !errorMessage && notifications.length === 0" class="text-sm text-gray-500 px-4 py-4">
        No notifications yet.
      </p>

      <button type="button" *ngFor="let n of notifications" (click)="onNotificationClick(n)"
        class="w-full text-left px-4 py-3 border-b border-gray-50 last:border-b-0"
        [class.bg-mint]="!n.isRead">
        <div class="flex items-center justify-between">
          <span class="text-sm font-semibold text-green-900">{{ n.title }}</span>
          <span *ngIf="!n.isRead" class="w-2 h-2 rounded-full bg-green-700"></span>
        </div>
        <p class="text-xs text-gray-600 mt-1">{{ n.message }}</p>
      </button>
    </div>
  </div>
</section>
