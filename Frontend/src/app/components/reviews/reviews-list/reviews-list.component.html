<section class="bg-gray-100 py-20">
  <div class="wrap">

    <div class="section-head">
      <h2 class="text-3xl md:text-4xl">
        What patients say after their visit
      </h2>
    </div>

    <div class="grid sm:grid-cols-2 gap-5">
      <app-review-card
        *ngFor="let r of displayedReviews"
        [review]="r">
      </app-review-card>
    </div>

    <div class="text-center mt-8" *ngIf="reviews.length > 2">
      <button
        type="button"
        (click)="toggleReviews()"
        class="px-6 py-3 rounded-lg bg-green-900 text-white hover:opacity-90 transition">
        {{ showAll ? 'Show Less' : 'See More' }}
      </button>
    </div>

  </div>
</section>
