<section class="px-5 md:px-8">
  <div class="bg-mint rounded-xl p-8 md:p-11 flex items-center justify-between gap-6 flex-wrap max-w-page mx-auto">
    <div>
      <h3 class="text-xl mb-1">Medical emergency?</h3>
      <p class="text-sm text-green-900/80">Our emergency department is open 24/7. Call the hotline or come straight in.</p>
    </div>
    <a [href]="'tel:' + hotline" class="btn btn-on-mint">Call {{ hotline }}</a>
  </div>
</section>
