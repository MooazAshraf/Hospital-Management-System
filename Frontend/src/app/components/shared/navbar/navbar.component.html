<nav
  dir="rtl"
  class="fixed top-0 right-0 w-full z-50 flex items-center justify-between px-8 py-4 bg-white shadow-sm"
>
  <!-- الشعار -->
  <a
    routerLink="/"
    class="flex items-center gap-2 text-green-900 font-bold text-xl"
  >
    <span
      class="w-7 h-7 rounded-md bg-green-900 text-white flex items-center justify-center"
    >
      +
    </span>

    urCare
  </a>

  <!-- الروابط -->
  <div class="flex items-center gap-8">

    <!-- الرئيسية -->
    <a
      routerLink="/"
      routerLinkActive="text-green-900 font-semibold"
      [routerLinkActiveOptions]="{ exact: true }"
      class="text-gray-700 transition-all duration-200 hover:text-green-900 hover:-translate-y-1"
    >
      الرئيسية
    </a>

    <!-- لوحة التحكم - للمستخدمين المسجلين فقط -->
    <a
      *ngIf="authService.isLoggedIn()"
      (click)="goToDashboard()"
      class="text-gray-700 transition-all duration-200 hover:text-green-900 hover:-translate-y-1 cursor-pointer"
    >
      لوحة التحكم
    </a>

    <!-- الأطباء -->
    <a
      routerLink="/doctors"
      routerLinkActive="text-green-900 font-semibold"
      class="text-gray-700 transition-all duration-200 hover:text-green-900 hover:-translate-y-1"
    >
      الأطباء
    </a>

    <!-- الصيدلية -->
    <a
      routerLink="/medicines"
      class="text-gray-700 transition-all duration-200 hover:text-green-900 hover:-translate-y-1"
    >
      الصيدلية
    </a>

    <!-- التقارير -->
    <a
      routerLink="/medical-reports"
      class="text-gray-700 transition-all duration-200 hover:text-green-900 hover:-translate-y-1"
    >
      التقارير
    </a>

    <!-- من نحن -->
    <a
      routerLink="/about"
      class="text-gray-700 transition-all duration-200 hover:text-green-900 hover:-translate-y-1"
    >
      من نحن
    </a>

    <!-- تواصل معنا -->
    <a
      routerLink="/contact"
      routerLinkActive="text-green-900 font-semibold"
      class="text-gray-700 transition-all duration-200 hover:text-green-900 hover:-translate-y-1"
    >
      تواصل معنا
    </a>
  </div>

  <!-- الجانب الأيمن -->
  <div class="flex items-center gap-5">

    <!-- ========================= -->
    <!-- USER LOGGED IN -->
    <!-- ========================= -->

    <ng-container
      *ngIf="currentUser$ | async as user; else guestLinks"
    >

      <!-- الإشعارات -->
      <app-notification-bell></app-notification-bell>

      <!-- قائمة المستخدم -->
      <div class="relative">

        <button
          (click)="toggleDropdown($event)"
          class="flex items-center gap-2 focus:outline-none"
        >
          <span
            class="w-9 h-9 rounded-full bg-green-900 text-white flex items-center justify-center text-sm font-semibold"
          >
            {{ getInitials(user.name) }}
          </span>

          <span class="text-gray-700 font-medium">
            {{ user.name }}
          </span>

          <svg
            class="w-4 h-4 text-gray-500 transition-transform"
            [class.rotate-180]="isDropdownOpen"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>

        <!-- القائمة المنسدلة -->
        <div
          *ngIf="isDropdownOpen"
          (click)="$event.stopPropagation()"
          class="absolute left-0 mt-3 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-2 z-50"
        >

          <!-- الملف الشخصي -->
          <a
            routerLink="/profile"
            class="block px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-green-900"
          >
            الملف الشخصي
          </a>

          <!-- لوحة التحكم -->
          <button
            (click)="goToDashboard()"
            class="w-full text-right block px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-green-900"
          >
            لوحة التحكم
          </button>

          <!-- ========================= -->
          <!-- ADMIN ONLY -->
          <!-- ========================= -->

          <a
            *ngIf="authService.isAdmin()"
            routerLink="/admin/audit-logs"
            class="block px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-green-900"
          >
            سجل العمليات
          </a>

          <!-- تسجيل الخروج -->
          <button
            (click)="onLogout()"
            class="w-full text-right px-4 py-2 text-red-600 hover:bg-red-50"
          >
            تسجيل الخروج
          </button>

        </div>
      </div>

    </ng-container>

    <!-- ========================= -->
    <!-- GUEST -->
    <!-- ========================= -->

    <ng-template #guestLinks>

      <!-- تسجيل الدخول -->
      <a
        routerLink="/login"
        class="text-gray-700 font-medium hover:text-green-900 transition"
      >
        تسجيل الدخول
      </a>

      <!-- التسجيل -->
      <a
        routerLink="/register"
        class="text-gray-700 font-medium hover:text-green-900 transition"
      >
        إنشاء حساب
      </a>

    </ng-template>

  </div>
</nav>
