<nav
  class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-8 py-4 bg-white shadow-sm"
>
  <!-- Logo -->
  <a routerLink="/" class="flex items-center gap-2 text-green-900 font-bold text-xl">
    <span class="w-7 h-7 rounded-md bg-green-900 text-white flex items-center justify-center">
      +
    </span>

    urCare
  </a>

  <!-- Links -->
  <div class="flex items-center gap-8">
    <!-- Home -->
    <a
      routerLink="/"
      routerLinkActive="text-green-900 font-semibold"
      [routerLinkActiveOptions]="{ exact: true }"
      class="text-gray-700 transition-all duration-200 hover:text-green-900 hover:-translate-y-1"
    >
      Home
    </a>

    <!-- Departments -->
    <a
      (click)="goToDashboard()"
      class="text-gray-700 transition-all duration-200 hover:text-green-900 hover:-translate-y-1 cursor-pointer"
    >
      Dashboard
    </a>

    <!-- Doctors -->
    <a
      routerLink="/doctors"
      routerLinkActive="text-green-900 font-semibold"
      class="text-gray-700 transition-all duration-200 hover:text-green-900 hover:-translate-y-1"
    >
      Doctors
    </a>

      <a routerLink="/medicines" class="hover:text-green-900"> Pharmacy </a>

      <a routerLink="/medical-reports" class="hover:text-green-900"> Reports </a>

      <a routerLink="/about" class="hover:text-green-900"> About </a>

    <!-- Contact -->
    <a
      routerLink="/contact"
      routerLinkActive="text-green-900 font-semibold"
      class="text-gray-700 transition-all duration-200 hover:text-green-900 hover:-translate-y-1"
    >
      Contact
    </a>
  </div>

  <!-- Right -->
  <div class="flex items-center gap-5">
    <ng-container *ngIf="currentUser$ | async as user; else guestLinks">
      <!-- User Dropdown -->
      <div class="relative">
        <button (click)="toggleDropdown($event)" class="flex items-center gap-2 focus:outline-none">
          <span
            class="w-9 h-9 rounded-full bg-green-900 text-white flex items-center justify-center text-sm font-semibold"
          >
            {{ getInitials(user.name) }}
          </span>
          <span class="text-gray-700 font-medium">{{ user.name }}</span>
          <svg
            class="w-4 h-4 text-gray-500 transition-transform"
            [class.rotate-180]="isDropdownOpen"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>

        <div
          *ngIf="isDropdownOpen"
          (click)="$event.stopPropagation()"
          class="absolute right-0 mt-3 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-2 z-50"
        >
          <a
            routerLink="/profile"
            class="block px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-green-900"
          >
            Profile
          </a>
          <button
            (click)="goToDashboard()"
            class="w-full text-left block px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-green-900"
          >
            Dashboard
          </button>
          <button
            (click)="onLogout()"
            class="w-full text-left px-4 py-2 text-red-600 hover:bg-red-50"
          >
            Log out
          </button>
        </div>
      </div>
    </ng-container>

    <ng-template #guestLinks>
      <a routerLink="/login" class="text-gray-700 font-medium hover:text-green-900 transition">
        Log in
      </a>
      <a
        routerLink="/book-appointment"
        class="px-5 py-3 rounded-lg bg-green-900 text-white font-semibold transition-all duration-200 hover:bg-green-950 hover:-translate-y-1"
      >
        Book appointment
      </a>
    </ng-template>
  </div>
</nav>
