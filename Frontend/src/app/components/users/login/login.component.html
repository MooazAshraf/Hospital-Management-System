<section class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <h2 class="text-2xl font-semibold text-gray-900">Welcome Back</h2>

      <p class="text-gray-500 text-sm mt-2">Login to your account</p>
    </div>

    <!-- Error Message -->
    <div
      *ngIf="errorMessage"
      class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3 mb-5"
    >
      {{ errorMessage }}
    </div>

    <!-- Login Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5"> Email </label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-green-700"
          [class.border-red-400]="f['email'].touched && f['email'].invalid"
        />

        <p
          *ngIf="f['email'].touched && f['email'].errors?.['required']"
          class="text-red-500 text-xs mt-1"
        >
          Email is required.
        </p>

        <p
          *ngIf="f['email'].touched && f['email'].errors?.['email']"
          class="text-red-500 text-xs mt-1"
        >
          Please enter a valid email.
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5"> Password </label>

        <input
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-green-700"
          [class.border-red-400]="f['password'].touched && f['password'].invalid"
        />

        <p
          *ngIf="f['password'].touched && f['password'].errors?.['required']"
          class="text-red-500 text-xs mt-1"
        >
          Password is required.
        </p>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-green-700 text-white rounded-lg py-2.5 text-sm font-medium hover:bg-green-800 disabled:opacity-50"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <!-- Register -->
    <p class="text-center text-sm text-gray-500 mt-6">
      Don't have an account?
      <a routerLink="/register" class="text-green-700 font-medium hover:underline"> Register </a>
    </p>
  </div>
</section>
